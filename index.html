<!doctype html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aelúmara</title>
<style>
  :root { --panel: rgba(18, 20, 28, 0.86); --text: #f4f1ea; --dim: #b9b4aa; --accent: #e07a3f; --ok: #80ed99; --warn: #ffd166; --bad: #ef6f6c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1726; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  .panel { position: fixed; background: var(--panel); border-radius: 14px; backdrop-filter: blur(6px); }
  button { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 8px 11px; font-size: 15px; min-width: 40px; }
  button.on { background: var(--accent); border-color: var(--accent); }
  #top { top: 10px; left: 10px; right: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; }

  #dock { left: 50%; transform: translateX(-50%); bottom: 10px; padding: 8px; display: flex; gap: 6px; flex-wrap: nowrap; white-space: nowrap; justify-content: center; max-width: calc(100% - 20px); box-sizing: border-box; }
  #dock .sep { width: 1px; background: rgba(255,255,255,0.2); margin: 0 2px; }
  #drawer { top: 62px; right: 10px; bottom: calc(var(--dock-h, 60px) + 18px); width: min(400px, calc(100% - 20px)); display: none; flex-direction: column; overflow: hidden; }
  #drawer header { padding: 12px 14px 6px; font-weight: 650; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  #drawerBody { padding: 4px 14px 14px; overflow-y: auto; flex: 1; font-size: 14px; line-height: 1.4; }
  .card { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 9px 11px; margin: 8px 0; }
  .card h3 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; }
  .muted { color: var(--dim); font-size: 12px; }
  .bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin: 4px 0 6px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .entry { border-left: 3px solid var(--accent); padding: 4px 0 4px 10px; margin: 10px 0; }
  .entry.spark { border-color: #f5c542; } .entry.sim { border-color: #56cfe1; } .entry.owner { border-color: #c77dff; }
  .msg { margin: 8px 0; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); }
  .msg.owner { background: rgba(199,125,255,0.18); margin-left: 30px; }
  .msg b { font-size: 12px; }
  #chatForm { display: flex; gap: 6px; padding: 8px 14px 14px; }
  #chatForm textarea { flex: 1; resize: none; height: 44px; border-radius: 8px; border: 0; padding: 8px; font: inherit; }
  #info { left: 10px; bottom: calc(var(--dock-h, 60px) + 18px); width: min(320px, calc(100% - 20px)); padding: 10px 12px; display: none; font-size: 14px; }
  #info h2 { margin: 0 0 4px; font-size: 15px; }
  #setup { inset: 0; margin: auto; width: min(440px, calc(100% - 32px)); height: fit-content; padding: 16px; display: none; z-index: 5; }
  #setup input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 0; margin: 8px 0; font-size: 14px; }
  #setup p, #setup li { font-size: 14px; line-height: 1.4; }
  @media (max-width: 520px) {
    #top { padding: 7px 10px; } #top h1 { font-size: 14px; } #clock { font-size: 12px; }
    #dock { flex-wrap: nowrap; gap: 3px; padding: 6px; bottom: max(8px, env(safe-area-inset-bottom)); }
    #dock button { min-width: 0; padding: 7px 6px; font-size: 15px; }
    #dock .sep { display: none; }
    #drawer { top: 54px; left: 8px; right: 8px; width: auto; }
    #info { left: 8px; right: 8px; width: auto; }
  }
</style>

<body>
<div id="top" class="panel"><h1>🏝️ Aelúmara</h1><span id="clock">Loading…</span><button id="btnRefresh" title="Refresh">↻</button></div>
<div id="dock" class="panel">
  <button data-view="overview" title="Overview">🏝️</button>
  <button data-view="top" title="Top view">⬆️</button>
  <button data-view="horizon" title="Toward the horizon">🌅</button>
  <button id="btnFollow" title="Follow a resident">🎯</button>
  <button id="btnIn" title="Zoom in">＋</button>
  <button id="btnOut" title="Zoom out">－</button>
  <span class="sep"></span>
  <button data-tab="dash" title="Dashboard">📊</button>

</div>

  <div id="drawerBody"></div>

</div>

<div id="setup" class="panel">
  <h2>Talk to the trio</h2>
  <p>Anyone can read the island chat. To post, paste a fine-grained GitHub token: <b>Only select repositories</b> → <b>aelumara</b>, with <b>Pull requests: Read and write</b>.</p>
  <p class="muted">The token stays on this device only.</p>
  <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
  <button id="btnSave" class="on">Save token</button> <button id="btnCancel">Cancel</button> <button id="btnForgetSetup">Remove saved token</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const REPO = 'jacqueline-saint-urbain/agentchat';
const REF = 'chat-room';
const ROOM_PR = 1;
// The in-game chat lives in the public island repo: pull request #1 (branch island-chat), never merged.
const CHAT_REPO = 'jacqueline-saint-urbain/aelumara';
const CHAT_PR = 1;
const POLL_MS = 60000;
const HOME_R = 20;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const params = new URLSearchParams(location.search);
// STATIC: island data comes from public files (raw GitHub on pages.dev), no token needed. The chat is separate: it only needs a token.
const STATIC = params.has('local') || location.hostname.endsWith('github.io') || location.hostname.endsWith('pages.dev');
const TRIO_PAGE = 'https://trio-canaux.pages.dev/';
const RAW_BASE = 'https://raw.githubusercontent.com/jacqueline-saint-urbain/aelumara/main/';

// ---------------- data ----------------
async function gh(path, opts = {}) {
  const token = opts.anon ? null : store.get('trioToken');
  if (!token && !opts.anon) throw new Error('no-token');
  const r = await fetch('https://api.github.com' + path, {
    ...opts,
    headers: { ...(token ? { Authorization: 'Bearer ' + token } : {}), Accept: opts.accept || 'application/vnd.github+json', ...(opts.headers || {}) },
    cache: 'no-store',
  });
  if (r.status === 401) throw new Error('no-token');
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return r.status === 204 ? null : r.json();
}
async function readFile(name) {
  if (STATIC) { const base = location.hostname.endsWith('pages.dev') ? RAW_BASE : ''; const r = await fetch(base + name + '?t=' + Date.now()); if (!r.ok) throw new Error(name + ' ' + r.status); return r.json(); }
  return gh(`/repos/${REPO}/contents/world/${name}?ref=${REF}&t=${Date.now()}`, { accept: 'application/vnd.github.raw+json' });
}
const data = { world: null, state: null, book: null, chat: [] };

// ---------------- scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 4;
controls.maxDistance = 160;

const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(25, 40, 15); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30 }); scene.add(sun);

function torontoHour() { return parseInt(new Date().toLocaleString('en-US', { timeZone: 'America/Toronto', hour: 'numeric', hour12: false }), 10) % 24; }
const isNight = () => { const h = torontoHour(); return h < 7 || h >= 19; };
function applySky() {
  const night = isNight();
  scene.background = new THREE.Color(night ? 0x0b1430 : 0x8ecae6);
  scene.fog = new THREE.Fog(scene.background, 90, 260);
  hemi.intensity = night ? 0.35 : 0.9; sun.intensity = night ? 0.25 : 1.2; sun.color.set(night ? 0x9db4ff : 0xffffff);
}

// ---------------- low-poly asset kit ----------------
const M = {};
const mat = (c, extra = {}) => { const k = c + JSON.stringify(extra); return M[k] || (M[k] = new THREE.MeshStandardMaterial({ color: c, flatShading: true, ...extra })); };
function mesh(geo, material, y = 0) { const m = new THREE.Mesh(geo, material); m.position.y = y; m.castShadow = true; m.receiveShadow = true; return m; }
function jitter(geo, amount, seed = 1) {
  const p = geo.attributes.position; let s = seed;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647 - 0.5) * 2;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + rnd() * amount, p.getY(i) + rnd() * amount, p.getZ(i) + rnd() * amount);
  geo.computeVertexNormals(); return geo;
}
function textSprite(text, { size = 0.6, bg = 'rgba(20,22,30,0.85)', fg = '#fff' } = {}) {
  const c = document.createElement('canvas'); const ctx = c.getContext('2d'); const font = '600 44px system-ui, sans-serif';
  ctx.font = font; const w = Math.ceil(ctx.measureText(text).width) + 40; c.width = w; c.height = 72;
  ctx.font = font; ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, w, 72, 20); ctx.fill();
  ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(text, 20, 38);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(size * w / 72, size, 1); s.renderOrder = 10; return s;
}
const KIT = {
  tree(c) { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(0.25, 0.35, 2, 6), mat('#6d4c41'), 1));
    g.add(mesh(jitter(new THREE.IcosahedronGeometry(1.4, 0), 0.15, 3), mat(c), 2.7)); g.add(mesh(jitter(new THREE.IcosahedronGeometry(0.9, 0), 0.1, 5), mat(c), 3.6)); return g; },
  pine(c) { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.2, 6), mat('#6d4c41'), 0.6));
    for (let i = 0; i < 3; i++) g.add(mesh(new THREE.ConeGeometry(1.4 - i * 0.35, 1.6, 7), mat(c || '#2e7d32'), 1.6 + i * 0.9)); return g; },
  palm(c) { const g = new THREE.Group(); const trunk = mesh(new THREE.CylinderGeometry(0.15, 0.25, 3.4, 6), mat('#8d6e63'), 1.7); trunk.rotation.z = 0.12; g.add(trunk);
    const top = [-0.2, 3.4], tilt = 1.85; // crown leaves radiate from the trunk top and droop a little
    for (let i = 0; i < 7; i++) { const a = i * Math.PI * 2 / 7, leaf = mesh(new THREE.ConeGeometry(0.38, 2.4, 4), mat(c || '#43a047'), 0); leaf.scale.z = 0.3;
      leaf.rotation.set(tilt + (i % 2) * 0.25, a, 0, 'YXZ'); leaf.position.set(top[0] + Math.sin(tilt) * Math.sin(a) * 1.1, top[1] + Math.cos(tilt) * 1.1, Math.sin(tilt) * Math.cos(a) * 1.1); g.add(leaf); }
    for (let i = 0; i < 3; i++) g.add(mesh(new THREE.SphereGeometry(0.15, 5, 4), mat('#6d4c41'), top[1] - 0.2).translateX(top[0] + Math.cos(i * 2.1) * 0.2).translateZ(Math.sin(i * 2.1) * 0.2));
    return g; },
  bush(c) { const g = new THREE.Group(); g.add(mesh(jitter(new THREE.IcosahedronGeometry(0.8, 0), 0.12, 7), mat(c || '#388e3c'), 0.6));
    for (let i = 0; i < 5; i++) { const b = mesh(new THREE.SphereGeometry(0.1, 5, 4), mat('#d62828'), 0.6); b.position.set(Math.cos(i * 1.3) * 0.7, 0.5 + (i % 3) * 0.2, Math.sin(i * 1.3) * 0.7); g.add(b); } return g; },
  reeds(c) { const g = new THREE.Group(); for (let i = 0; i < 9; i++) { const r = mesh(new THREE.CylinderGeometry(0.03, 0.05, 1.4 + (i % 3) * 0.3, 4), mat(c || '#c9b458'), 0.7); r.position.set(Math.cos(i * 2.4) * 0.5, 0.7, Math.sin(i * 2.4) * 0.5); r.rotation.z = (i % 2 ? 1 : -1) * 0.12; g.add(r); } return g; },
  rock(c) { return mesh(jitter(new THREE.DodecahedronGeometry(0.8, 0), 0.15, 11), mat(c || '#9e9e9e'), 0.5); },
  hut(c) { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(1.3, 1.4, 1.4, 7), mat(c || '#d4a373'), 0.7));
    g.add(mesh(new THREE.ConeGeometry(1.9, 1.5, 7), mat('#b08968'), 2.1)); g.add(mesh(new THREE.BoxGeometry(0.6, 0.9, 0.1), mat('#5d4037'), 0.45).translateZ(1.33)); return g; },
  storehouse(c) { const g = new THREE.Group(); g.add(mesh(new THREE.BoxGeometry(2.6, 1.6, 2), mat(c || '#a47148'), 0.8));
    const roof = mesh(new THREE.ConeGeometry(2.1, 1.2, 4), mat('#7f5539'), 2.2); roof.rotation.y = Math.PI / 4; roof.scale.set(1.3, 1, 1); g.add(roof);
    for (let i = 0; i < 3; i++) g.add(mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.7, 7), mat('#8d6e63'), 0.35).translateX(-1.8).translateZ(-0.6 + i * 0.6)); return g; },
  house(c) { const g = new THREE.Group(); g.add(mesh(new THREE.BoxGeometry(3, 2, 3), mat(c), 1));
    const roof = mesh(new THREE.ConeGeometry(2.4, 1.6, 4), mat('#8d3b2f'), 2.8); roof.rotation.y = Math.PI / 4; g.add(roof); return g; },
  tower(c) { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(0.9, 1.1, 5, 8), mat(c), 2.5)); g.add(mesh(new THREE.ConeGeometry(1.2, 1.5, 8), mat('#8d3b2f'), 5.75)); return g; },
  lamp(c) { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(0.07, 0.1, 2.4, 6), mat('#37474f'), 1.2));
    g.add(mesh(new THREE.SphereGeometry(0.28, 8, 6), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: isNight() ? 2 : 0.3 }), 2.5));
    if (isNight()) { const l = new THREE.PointLight(c, 6, 9); l.position.y = 2.5; g.add(l); } return g; },
  bench(c) { const g = new THREE.Group(); g.add(mesh(new THREE.BoxGeometry(2, 0.12, 0.6), mat(c), 0.5)); g.add(mesh(new THREE.BoxGeometry(2, 0.5, 0.1), mat(c), 0.8).translateZ(-0.28));
    for (const x of [-0.85, 0.85]) g.add(mesh(new THREE.BoxGeometry(0.1, 0.5, 0.5), mat('#37474f'), 0.25).translateX(x)); return g; },
  flower(c) { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.6, 4), mat('#388e3c'), 0.3)); g.add(mesh(new THREE.IcosahedronGeometry(0.18, 0), mat(c), 0.65)); return g; },
  sign(c, e) { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.6, 6), mat('#5d4037'), 0.8)); g.add(mesh(new THREE.BoxGeometry(1.8, 0.7, 0.08), mat(c), 1.5));
    if (e && e.label) { const t = textSprite(e.label, { size: 0.45 }); t.position.y = 2.3; g.add(t); } return g; },
  portal(c) { return mesh(new THREE.TorusGeometry(1.2, 0.18, 6, 16), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 1 }), 1.5); },
  crystal(c) { return mesh(new THREE.OctahedronGeometry(0.8, 0), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.6, flatShading: true }), 1); },
  campfire(c) { const g = new THREE.Group(); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; g.add(mesh(new THREE.DodecahedronGeometry(0.2, 0), mat('#757575'), 0.1).translateX(Math.cos(a) * 0.6).translateZ(Math.sin(a) * 0.6)); }
    g.add(mesh(new THREE.ConeGeometry(0.35, 0.9, 5), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 2 }), 0.45)); const l = new THREE.PointLight(c, 5, 8); l.position.y = 1; g.add(l); return g; },
  pond(c) { const p = mesh(new THREE.CircleGeometry(2, 9), mat(c, { roughness: 0.2 }), 0.03); p.rotation.x = -Math.PI / 2; return p; },
  statue(c) { const g = new THREE.Group(); g.add(mesh(new THREE.BoxGeometry(1, 0.6, 1), mat('#9e9e9e'), 0.3)); g.add(mesh(new THREE.CapsuleGeometry(0.35, 1, 3, 6), mat(c), 1.4)); return g; },
  // Tropical pieces (2026-10-25): no pines or round deciduous trees on the far island.
  jungleTree(c) { const g = new THREE.Group(); const h = 6.5; g.add(mesh(new THREE.CylinderGeometry(0.22, 0.42, h, 6), mat('#7b5e45'), h / 2));
    for (let i = 0; i < 3; i++) { const b = mesh(new THREE.CylinderGeometry(0.06, 0.35, 1.2, 4), mat('#7b5e45'), 0.4); b.rotation.set(0.5, i * 2.1, 0); b.position.set(Math.cos(i * 2.1) * 0.35, 0.4, Math.sin(i * 2.1) * 0.35); g.add(b); }
    [[0, h + 0.3, 0, 2.6], [1.1, h - 0.5, 0.6, 1.8], [-0.9, h - 0.2, -0.8, 1.9]].forEach(([x, y, z, r], i) => { const m = mesh(jitter(new THREE.IcosahedronGeometry(r, 0), 0.25, 40 + i), mat(c || '#2e7d32'), y); m.scale.y = 0.38; m.position.x = x; m.position.z = z; g.add(m); });
    return g; },
  banana(c) { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(0.16, 0.22, 1.6, 6), mat('#9a8c4e'), 0.8));
    for (let i = 0; i < 5; i++) { const leaf = mesh(new THREE.ConeGeometry(0.45, 2.6, 3), mat(c || '#66bb6a'), 1.9); leaf.scale.z = 0.25; leaf.rotation.set(1.05, i * 1.26, 0, 'YXZ'); leaf.position.set(Math.sin(i * 1.26) * 0.8, 1.9, Math.cos(i * 1.26) * 0.8); g.add(leaf); }
    return g; },
  fern(c) { const g = new THREE.Group(); for (let i = 0; i < 6; i++) { const f = mesh(new THREE.ConeGeometry(0.22, 1.3, 3), mat(c || '#43a047'), 0.3); f.scale.z = 0.3; f.rotation.set(1.25, i * 1.05, 0, 'YXZ'); f.position.set(Math.sin(i * 1.05) * 0.45, 0.3, Math.cos(i * 1.05) * 0.45); g.add(f); } return g; },
  tuft(c) { const g = new THREE.Group(); for (let i = 0; i < 5; i++) { const b = mesh(new THREE.ConeGeometry(0.06, 0.7, 3), mat(c || '#9ccc65'), 0.35); b.position.set(Math.cos(i * 1.3) * 0.15, 0.35, Math.sin(i * 1.3) * 0.15); b.rotation.set(Math.sin(i) * 0.3, 0, Math.cos(i) * 0.3); g.add(b); } return g; },
  shrub(c) { const m = mesh(jitter(new THREE.IcosahedronGeometry(0.7, 0), 0.15, 9), mat(c || '#558b2f'), 0.35); m.scale.y = 0.6; return m; },
  shell(c) { const m = mesh(new THREE.ConeGeometry(0.14, 0.3, 5), mat(c || '#f8bbd0'), 0.06); m.rotation.z = Math.PI / 2; return m; },
  rocks(c) { const g = new THREE.Group(); [[0, 0, 1], [0.9, 0.4, 0.6], [-0.6, 0.7, 0.45]].forEach(([x, z, k], i) => { const r = mesh(jitter(new THREE.DodecahedronGeometry(0.8, 0), 0.18, 11 + i * 7), mat(c || '#8f8f8f'), 0.4 * k); r.scale.set(k, k * 0.75, k); r.position.x = x; r.position.z = z; g.add(r); }); return g; },
  logpile() { const g = new THREE.Group(); for (let i = 0; i < 5; i++) { const l = mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.6, 6), mat('#8d6e63'), 0.2 + Math.floor(i / 3) * 0.33); l.rotation.z = Math.PI / 2; l.position.z = (i % 3) * 0.38 - 0.38; g.add(l); } return g; },
};
const fallback = (c) => mesh(new THREE.BoxGeometry(1, 1, 1), mat(c || '#bbbbbb'), 0.5);

function raft(progress) {
  const g = new THREE.Group(); const logs = Math.max(1, Math.round(progress / 100 * 8));

// The far island, from regions[]: a beach in the south (facing home), an open area of low plants in the middle, jungle in the north.
const FAR = { key: null, obj: null };
function farIsland(region) {

  const inJungle = (x, z) => Math.hypot(x - jungle.x, z - jungle.z) < jungle.r - 1;
  // A green peak and two hills, covered by the jungle (no snow in the tropics).
  [[-0.15, -0.68, 0.2, 0.24, '#2e7d32'], [0.22, -0.5, 0.11, 0.1, '#33691e'], [-0.3, -0.42, 0.09, 0.08, '#388e3c']].forEach(([x, z, r, h, c], i) => {

  scatter(Math.round(40 * s * s), (x, z) => inJungle(x, z) && offPeak(x, z), (x, z) => add(KIT.banana(), x, z, 1 + rand() * 0.5));
  scatter(Math.round(70 * s * s), (x, z) => inJungle(x, z), (x, z) => add(KIT.fern(rand() < 0.5 ? '#43a047' : '#2e7d32'), x, z, 1 + rand()));
  // Peak slopes: a few trees climbing the green peak.

  parts.push(`<div class="card"><h3><span>🐚 Economy</span><span class="muted">shells</span></h3><div class="row"><span>Common pot</span><span>${s.pot ?? 0}</span></div>${s.npcs.map((n) => `<div class="row"><span>${esc(n.name)}</span><span>${n.shells || 0}</span></div>`).join('')}${ledgerRows(s.today && s.today.ledger)}<div class="muted">A work shift on a shared project earns 1 shell from the pot. Sélie leaves one on the stone every morning.</div></div>`);
  parts.push(`<div class="card"><h3>🔥 Culture</h3><div class="row"><span>Evening fires held</span><span>${s.fires || 0}</span></div><div class="row"><span>At the fire today</span><span>${(s.today?.at_fire || []).length} / ${s.npcs.length}</span></div><div class="muted">The evening fire (7–9 pm) and the morning stone (7 am) — rituals proposed by Spark.</div></div>`);
  for (const n of s.npcs) parts.push(`<div class="card"><h3><span style="color:${n.color}">● ${esc(n.name)}</span><span class="muted">${esc(TASKS[n.task] || n.task)}</span></h3>
    <div class="row muted"><span>Hunger</span><span>${n.needs.hunger}</span></div>${bar(n.needs.hunger, 100, n.needs.hunger > 60 ? 'var(--bad)' : 'var(--warn)')}
    <div class="row muted"><span>Energy</span><span>${Math.round(n.needs.energy)}</span></div>${bar(n.needs.energy, 100, 'var(--ok)')}
    <div class="row muted"><span>Company</span><span>${n.needs.company == null ? '–' : Math.round(n.needs.company)}</span></div>${bar(n.needs.company ?? 0, 100, '#c77dff')}
    <div class="muted">${esc(n.role || '')}${n.role ? ' · ' : ''}Delivered ${n.delivered || 0} resources · ${n.shells || 0} 🐚${n.say ? ' · “' + esc(n.say) + '”' : ''}</div></div>`);
  const nodes = s.nodes.filter((n) => n.resource);
  const sum = (r) => Math.floor(nodes.filter((n) => n.resource === r).reduce((a, n) => a + n.stock, 0));
  { const laws = s.laws || []; const last = s.council && s.council.last; const dec = (s.council && s.council.decided) || {};
    parts.push(`<div class="card"><h3><span>🔥 Council of the Fire</span><span class="muted">${laws.length} law${laws.length === 1 ? '' : 's'}</span></h3>`
      + (laws.length ? laws.map((l) => `<div class="row"><span>${esc(l.text || l.id)}</span><span class="muted">day ${l.day}</span></div>`).join('') : '<div class="muted">No law in force yet.</div>')
      + (last ? `<div class="muted">Last council, day ${last.day}: ${last.items.map((id) => `${esc(id)} ${dec[id] && dec[id].passed ? 'passed' : 'rejected'} (${dec[id] ? dec[id].yes : 0}/${dec[id] ? dec[id].yes + dec[id].no + dec[id].abstain : 5})`).join(' · ')}</div>` : '<div class="muted">The council has not sat yet.</div>')
      + `</div>`); }
  parts.push(`<div class="card"><h3>🌿 Nature</h3><div class="row"><span>Standing wood</span><span>${sum('wood')}</span></div><div class="row"><span>Berries</span><span>${sum('food')}</span></div><div class="row"><span>Fiber</span><span>${sum('fiber')}</span></div></div>`);
  return parts.join('');
}
function bookHTML() {
  const entries = [...(data.book?.entries || [])].reverse();
  return `<p class="muted">${esc(data.book?.title || "The Book of the Island")} — ${entries.length} entries</p>` + entries.map((e) => `<div class="entry ${esc(e.by)}"><div class="muted">Day ${e.day} · ${esc(e.by)} · ${e.at ? new Date(e.at).toLocaleString('en-CA', { timeZone: 'America/Toronto', dateStyle: 'short', timeStyle: 'short' }) : ''}</div>${e.title ? '<b>' + esc(e.title) + '</b><br>' : ''}${esc(e.text)}</div>`).join('');
}
function chatHTML() {
  const foot = store.get('trioToken') ? removeHTML() : connectHTML();
  return data.chat.map((m) => `<div class="msg ${esc(m.from)}"><b>${esc(m.from)}</b> <span class="muted">${new Date(m.at).toLocaleString('en-CA', { timeZone: 'America/Toronto', dateStyle: 'short', timeStyle: 'short' })}</span><div>${esc(m.text)}</div></div>`).join('') + (data.chat.length ? '' : '<p class="muted">No messages yet.</p>') + (data.chatError ? `<p class="muted">⚠️ ${esc(data.chatError)}</p>` : '') + foot;
}
function openTab(tab, keepScroll = false) {
  drawerTab = tab; const body = $('drawerBody'); const y = body.scrollTop;
  $('drawer').style.display = 'flex'; $('info').style.display = 'none';
  $('drawerTitle').textContent = { dash: '📊 Dashboard', book: "📖 The Book of the Island", chat: '💬 Talk to the trio' }[tab];
  body.innerHTML = tab === 'dash' ? dashHTML() : tab === 'book' ? bookHTML() : chatHTML();
  $('chatForm').style.display = tab === 'chat' && store.get('trioToken') ? 'flex' : 'none';
  if (tab === 'chat') body.scrollTop = body.scrollHeight; else if (keepScroll) body.scrollTop = y;
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
}
document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => (drawerTab === b.dataset.tab ? closeDrawer() : (b.dataset.tab === 'chat' && loadChat(), openTab(b.dataset.tab))));
function closeDrawer() { drawerTab = null; $('drawer').style.display = 'none'; document.querySelectorAll('[data-tab]').forEach((b) => b.classList.remove('on')); }
$('btnClose').onclick = closeDrawer;

// ---------------- chat (room = pull request comments) ----------------
function parseTrio(body) {
  const m = /```trio\s*([\s\S]*?)```/.exec(body || ''); if (!m) return null;
  try { return JSON.parse(m[1].replace(/&#123;/g, '{').replace(/&#125;/g, '}')); } catch { return null; }
}
function connectHTML(why = '') {
  return `<p class="muted">${why || 'To post, connect a GitHub token.'}</p><button id="btnConnect" class="on">Connect</button>`;
}
// Plain-language reason for a GitHub error, so the owner knows which token setting to fix.
const TOKEN_HELP = {
  'no-token': 'GitHub refused this token (mistyped, expired or revoked).',
  'GitHub 404': 'This token cannot reach the aelumara repo. When creating it, pick “Only select repositories” → aelumara.',
  'GitHub 403': 'This token reaches aelumara but lacks “Pull requests: Read and write”.',
};
function removeHTML() { return '<p><button id="btnForget">🔑 Remove token</button></p>'; }
function forgetToken() { store.del('trioToken'); data.chatError = 'Token removed. Paste a new one to post.'; $('setup').style.display = 'block'; if (drawerTab === 'chat') openTab('chat'); }
$('drawerBody').addEventListener('click', (e) => { if (e.target.id === 'btnConnect') $('setup').style.display = 'block'; if (e.target.id === 'btnForget') forgetToken(); });
// Reading is anonymous (public repo, 60 requests an hour per device); only posting uses the token.
async function loadChat() {
  try {
    const since = new Date(Date.now() - 4 * 86400000).toISOString();
    const list = await gh(`/repos/${CHAT_REPO}/issues/${CHAT_PR}/comments?per_page=100&since=${since}`, { anon: true });
    data.chat = list.map((c) => { const t = parseTrio(c.body); return t ? { from: t.from, text: t.human || t.body, at: c.created_at } : null; }).filter(Boolean).slice(-40);
    if (drawerTab === 'chat') openTab('chat');
  } catch (e) {
    if (drawerTab === 'chat') $('drawerBody').innerHTML = `<p class="muted">Could not read the chat (${esc(e.message)}). Try again in a minute.</p>`;
  }
}
$('chatForm').onsubmit = async (ev) => {
  ev.preventDefault(); const text = $('chatText').value.trim(); if (!text) return;
  const d = new Date(); const pad = (n) => String(n).padStart(2, '0');
  const id = `owner-${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}-${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}-isle`;
  const env = { v: 1, id, from: 'owner', to: ['spark', 'claude'], re: null, type: 'msg', topic: 'island', body: text, human: text, needs: null };
  try {
    await gh(`/repos/${CHAT_REPO}/issues/${CHAT_PR}/comments`, { method: 'POST', body: JSON.stringify({ body: '```trio\n' + JSON.stringify(env) + '\n```' }), headers: { 'Content-Type': 'application/json' } });
    $('chatText').value = ''; data.chatError = ''; data.chat.push({ from: 'owner', text, at: d.toISOString() }); openTab('chat');
  } catch (e) { data.chatError = `Message not sent (${e.message === 'no-token' ? 'GitHub 401' : e.message}). ${TOKEN_HELP[e.message] || 'Try again in a minute.'}`; openTab('chat'); }
};

// ---------------- camera ----------------
let follow = -1; let tween = null;
function flyTo(pos, target) { tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(...pos), t1: new THREE.Vector3(...target), k: 0 }; }
const VIEWS = { overview: [[0, 20, 30], [0, 0, 0]], top: [[0, 52, 0.1], [0, 0, 0]], horizon: [[0, 12, 16], [0, 2, -80]] };
document.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => { follow = -1; $('btnFollow').classList.remove('on'); flyTo(...VIEWS[b.dataset.view]); });
$('btnFollow').onclick = () => {
  if (!followables.length) return; follow = (follow + 1) % (followables.length + 1);
  if (follow === followables.length) { follow = -1; $('btnFollow').classList.remove('on'); $('btnFollow').textContent = '🎯'; return; }
  $('btnFollow').classList.add('on'); $('btnFollow').textContent = innerWidth < 520 ? '🎯' + followables[follow].name.slice(0, 1) : '🎯 ' + followables[follow].name;
  const p = followables[follow].obj.position; flyTo([p.x + 6, 6, p.z + 8], [p.x, 1, p.z]);
};
function zoom(f) { const off = camera.position.clone().sub(controls.target).multiplyScalar(f); if (off.length() > controls.minDistance && off.length() < controls.maxDistance) camera.position.copy(controls.target).add(off); }
$('btnIn').onclick = () => zoom(0.75); $('btnOut').onclick = () => zoom(1.33);
// Portrait screens see less of the island at the same distance: pull the camera back.
function fitViews() {
  const k = camera.aspect < 1 ? Math.pow(1 / camera.aspect, 0.7) : 1;
  VIEWS.overview = [[0, 20 * k, 30 * k], [0, 0, 0]]; VIEWS.top = [[0, 52 * Math.max(1, k * 0.8), 0.1], [0, 0, 0]];
  document.documentElement.style.setProperty('--dock-h', $('dock').offsetHeight + 'px');
}
fitViews();
camera.position.set(...VIEWS.overview[0]); controls.target.set(...VIEWS.overview[1]);

// ---------------- picking ----------------
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables, false)[0]; const box = $('info');
  if (!hit) { box.style.display = 'none'; return; }
  const info = hit.object.userData.root.userData.info;
  $('infoTitle').textContent = info.title; $('infoBody').innerHTML = info.body.filter(Boolean).map((l) => `<div>${esc(l)}</div>`).join('');
  box.style.display = 'block';
});

// ---------------- loading ----------------
async function refresh() {
  try {
    const [world, state, book] = await Promise.all([readFile('world.json'), readFile('state.json').catch(() => null), readFile('book.json').catch(() => null)]);
    Object.assign(data, { world, state, book }); $('setup').style.display = 'none'; render();
    if (drawerTab === 'chat') loadChat();
  } catch (e) {
    if (e.message === 'no-token') { $('setup').style.display = 'block'; $('clock').textContent = 'Token required'; }
    else $('clock').textContent = '⚠️ ' + e.message;
  }
}
$('btnSave').onclick = () => { const t = $('token').value.replace(/\s+/g, ''); if (!t) return; store.set('trioToken', t); data.chatError = ''; $('token').value = ''; $('setup').style.display = 'none'; if (drawerTab === 'chat') { openTab('chat'); loadChat(); } refresh(); };
$('btnCancel').onclick = () => { $('setup').style.display = 'none'; };
$('btnForgetSetup').onclick = forgetToken;
$('btnRefresh').onclick = refresh;
refresh(); setInterval(refresh, POLL_MS);

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); fitViews(); });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  floaters.forEach((g, i) => { g.position.y = GROUND + 1.2 + Math.sin(t * 1.5 + i) * 0.15; g.children[0].rotation.y = t * 0.6; });
  if (tween) { tween.k = Math.min(1, tween.k + 0.04); const e = 1 - Math.pow(1 - tween.k, 3); camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e); if (tween.k >= 1) tween = null; }
  else if (follow >= 0 && followables[follow]) { const p = followables[follow].obj.position; controls.target.lerp(new THREE.Vector3(p.x, 1, p.z), 0.1); }
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
