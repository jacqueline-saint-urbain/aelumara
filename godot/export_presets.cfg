[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="terrain/*.bin, terrain/*.json"
exclude_filter="tools/*, *.md"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>body{background:#0e1726}</style><script>(function(){var f=window.fetch;window.fetch=function(u,o){var s=String((u&&u.url)||u);if(!/index\\.wasm(\\?|$)/.test(s))return f(u,o);return f('index.wasm.parts.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}).then(function(m){if(!m)return f(u,o);return Promise.all(m.parts.map(function(p){return f(p).then(function(r){if(!r.ok)throw new Error(p+' '+r.status);return r.arrayBuffer()})})).then(function(b){var blob=new Blob(b,{type:'application/wasm'});return new Response(blob,{status:200,headers:{'Content-Type':'application/wasm','Content-Length':String(blob.size)}})})})}})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
